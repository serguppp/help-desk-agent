[project]
name = "citywheels-helpdesk"
version = "0.1.0"
description = "Command-line help desk agent for CityWheels."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
files = ["helpdesk", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
