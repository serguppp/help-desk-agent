repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
